<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOTA PSOE </title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Archivo', sans-serif;
        }

        .bg-psoe {
            background-color: #ba0505;
        }

        .text-psoe {
            color: #ae0505;
        }

        /* Dramatic diagonal cut for the hero section */
        .clip-hero {
            clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);
        }

        /* Scrolling marquee animation */
        @keyframes marquee {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 15s linear infinite;
        }
    </style>
</head>

<body class="bg-zinc-950 text-white selection:bg-white selection:text-[#E30613] overflow-x-hidden w-full max-w-full">

    <nav
        class="mt-4  fixed w-full max-w-full z-50 -mix-blend-difference px-4 py-4 sm:p-6 flex flex-wrap gap-4 justify-between items-center box-border">
        <div class="text-3xl sm:text-4xl font-black text-white leading-none shrink-0">
            VOTA<br>PSOE
        </div>
        <!--a href="#unete"
            class="border-2 border-white text-white px-4 py-2 sm:px-6 sm:py-2 text-sm sm:text-base rounded-full font-bold uppercase tracking-wide hover:bg-white hover:text-black transition-all duration-300 whitespace-nowrap shrink-0">
            Actúa Ahora
        </a-->
    </nav>

    <header class="relative bg-psoe min-h-screen flex items-center pt-20 overflow-hidden">
        <div class="absolute inset-0 bg-black opacity-10 mix-blend-multiply"></div>

        <div
            class="relative z-10 w-full px-4 sm:px-8 lg:px-16 flex flex-col justify-between items-stretch gap-12 lg:gap-8">
            <h1
                class="text-[4rem] min-[400px]:text-[5rem] sm:text-[8rem] lg:text-[13rem] font-black leading-none tracking-tighter uppercase text-[#f6db71] drop-shadow-2xl break-words">
                España<br>
                <span class="text-[#f6db71]">Avanza.</span>
            </h1>

            <div
                class="flex flex-col justify-end max-w-sm w-full ml-auto pt-4 lg:pt-0 pb-12 lg:pb-0 h-full gap-8 text-right">
                <div style="font-family: 'Instrument Serif', serif;"
                    class="text-4xl sm:text-6xl lg:text-[4.5rem] text-white leading-tight italic tracking-tight break-words hyphens-auto font-bold"
                    lang="es">
                    Tú también!
                </div>

                <form id="signup-form" action="https://submit-form.com/5K4dK3TQC"
                    class="w-full max-w-full relative group mt-auto flex flex-col gap-3">
                    <label for="email" class="sr-only">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="Tu correo electrónico" required
                        style="font-family: 'Instrument Serif', serif;"
                        class="w-full bg-transparent text-white placeholder-white/50 text-xl italic border-b border-white/40 focus:border-[#f6db71] focus:outline-none pb-2 transition-colors duration-300" />
                    <button type="submit" id="signup-btn"
                        class="mt-0 w-full bg-[#f6db71] text-[#c10d0d] font-black uppercase tracking-[0.15em] text-sm py-3 px-6 hover:bg-white transition-colors duration-300 rounded-none">
                        SÚMALE 1 →
                    </button>
                    <p id="signup-error" class="hidden text-white/60 text-xs text-right">Algo ha fallado. Inténtalo de
                        nuevo.</p>
                </form>
            </div>
        </div>
    </header>

    <div id="year-label" class="fixed bottom-4 left-4 text-white/70 text-xs font-mono tracking-widest z-50"></div>

    <script>
        document.getElementById('year-label').textContent = '' + new Date().getFullYear();
        document.getElementById('signup-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const form = e.target;
            const btn = document.getElementById('signup-btn');
            const error = document.getElementById('signup-error');

            btn.textContent = '...';
            btn.disabled = true;
            error.classList.add('hidden');

            const payload = {};
            new FormData(form).forEach((v, k) => payload[k] = v);

            try {
                const res = await fetch(form.action, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    }
                });
                if (res.ok) {
                    form.innerHTML = '<p style="font-family:\'Instrument Serif\', serif;" class="text-white/80 italic text-lg">¡Gracias! Te avisaremos pronto.</p>';
                } else {
                    throw new Error('Response ' + res.status);
                }
            } catch (err) {
                console.error(err);
                btn.textContent = 'Sumarme →';
                btn.disabled = false;
                error.classList.remove('hidden');
            }
        });
    </script>

</body>

</html>
