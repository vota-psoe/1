<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOTA PSOE | España Avanza</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Archivo', sans-serif;
            background-color: #1a1a1a;
            /* Changed to 1a1a1a, original Red was #ba0505 */
            color: #F4F4F0;
            /* Stark off-white/cream */
            /*s ba0505 ae0505*/
        }

        /* Subtle paper texture for analog authenticity, no cartoonish noise */
        .paper-grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
            opacity: 0.4;
            mix-blend-mode: multiply;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Institutional input styling */
        .bureaucratic-input {
            background: transparent;
            border: none;
            border-bottom: 3px solid #1A1A1A;
            color: #1A1A1A;
            border-radius: 0;
        }

        .bureaucratic-input:focus {
            outline: none;
            border-bottom-color: #000000;
        }

        .bureaucratic-input::placeholder {
            color: rgba(26, 26, 26, 0.5);
        }
    </style>
</head>

<body class="selection:bg-[#1A1A1A] selection:text-[#F4F4F0] min-h-screen flex flex-col m-0 p-0 overflow-x-hidden">

    <div class="paper-grain"></div>

    <header
        class="w-full bg-[#1A1A1A] text-[#F4F4F0] px-6 py-4 flex justify-between items-end border-b-8 border-[#F4F4F0]">
        <div class="text-xl md:text-2xl font-black tracking-widest uppercase">
            VOTA PSOE
        </div>
        <div class="text-sm font-bold tracking-widest uppercase opacity-80">
            Manifiesto 2026
        </div>
    </header>

    <main class="flex-grow flex flex-col lg:flex-row w-full max-w-[1600px] mx-auto">

        <div
            class="w-full lg:w-3/5 bg-[#ba0505] p-8 md:p-16 flex flex-col border-b-8 lg:border-b-0 lg:border-r-8 border-[#1A1A1A]">
            <div class="flex-grow flex items-center justify-center text-center pb-8 md:pb-0">
                <h1
                    class="text-[5rem] sm:text-[8rem] lg:text-[12rem] font-black leading-[0.8] tracking-tighter uppercase text-[#f6db71] m-0">
                    ESPAÑA<br>
                    <span class="text-[#F4F4F0]">AVANZA</span>
                </h1>
            </div>
            <p
                class="w-full text-right text-2xl md:text-4xl font-extrabold uppercase tracking-tight text-[#f2f2f2] leading-none mt-auto">
                Tú también
            </p>
        </div>

        <div class="w-full lg:w-2/5 bg-[#F4F4F0] flex flex-col justify-center relative">

            <div class="p-8 md:p-16 flex flex-col justify-center flex-grow">
                <h2
                    class="text-[#E30613] text-4xl md:text-5xl font-black uppercase tracking-tighter leading-none mb-10">
                    SÉ PARTE<br>DEL PLAN.
                </h2>

                <form id="signup-form" action="https://submit-form.com/5K4dK3TQC" class="w-full flex flex-col gap-8">
                    <div class="relative">
                        <label for="email"
                            class="block text-[#1A1A1A] font-bold uppercase tracking-widest text-xs mb-2"> </label>
                        <input type="email" id="email" name="email" placeholder="SU CORREO" required
                            class="bureaucratic-input w-full text-2xl md:text-3xl font-bold uppercase tracking-wide py-2 transition-all" />
                    </div>

                    <button type="submit" id="signup-btn"
                        class="w-full bg-[#1A1A1A] text-[#F4F4F0] font-black uppercase tracking-[0.15em] text-xl py-6 hover:bg-[#E30613] transition-colors duration-300">
                        RECIBIR EL MANIFIESTO →
                    </button>

                    <p id="signup-error"
                        class="hidden text-[#E30613] font-bold text-sm uppercase tracking-wide border-l-4 border-[#E30613] pl-3">
                        Error de validación. Inténtelo de nuevo.
                    </p>
                </form>
            </div>

            <div class="bg-[#1A1A1A] p-6 text-[#F4F4F0] w-full mt-auto">
                <div
                    class="text-xs font-bold tracking-widest uppercase flex flex-col md:flex-row justify-between gap-4">
                    <span>INICIATIVA INDEPENDIENTE — NO OFICIAL</span>
                    <span><a href="mailto:hola@votapsoe.es"
                            class="hover:text-[#f6db71] text-[#E30613] transition-colors">hola@votapsoe.es</a></span>
                    <span id="year-label"></span>
                </div>
            </div>
        </div>

    </main>

    <script>
        document.getElementById('year-label').textContent = new Date().getFullYear();

        document.getElementById('signup-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const form = e.target;
            const btn = document.getElementById('signup-btn');
            const error = document.getElementById('signup-error');

            const originalBtnText = btn.textContent;
            btn.textContent = 'PROCESANDO DATOS...';
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-wait');
            error.classList.add('hidden');

            const payload = {};
            new FormData(form).forEach((v, k) => payload[k] = v);

            try {
                const res = await fetch(form.action, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    }
                });
                if (res.ok) {
                    form.innerHTML = `
                        <div class="border-4 border-[#1A1A1A] p-6 text-[#1A1A1A]">
                            <p class="font-black text-3xl uppercase tracking-tighter mb-2">BIENVENIDO <br>A LA VANGUARDIA</p>
                            <p class="font-bold uppercase tracking-widest text-sm">El futuro empieza en tu bandeja de entrada.</p>
                        </div>`;
                } else {
                    throw new Error('Response ' + res.status);
                }
            } catch (err) {
                console.error(err);
                btn.textContent = originalBtnText;
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-wait');
                error.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
